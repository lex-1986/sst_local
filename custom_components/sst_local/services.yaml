set_schedule:
  target:
    entity:
      integration: sst_local
      domain: climate
  fields:
    period:
      required: true
      example: weekdays
      selector:
        select:
          translation_key: period
          options:
            - weekdays
            - weekend
    points:
      required: true
      example: >-
        [{"time": "06:00", "temperature": 26}, {"time": "08:00", "temperature": 16},
        {"time": "20:00", "temperature": 26}, {"time": "22:00", "temperature": 16}]
      selector:
        object:

get_schedule:
  target:
    entity:
      integration: sst_local
      domain: climate
