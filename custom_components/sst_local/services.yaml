set_schedule:
  target:
    entity:
      integration: sst_local
      domain: climate
  fields:
    days:
      required: true
      example: ["mon", "tue", "wed", "thu", "fri"]
      selector:
        select:
          multiple: true
          translation_key: day
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    points:
      required: true
      example: >-
        [{"time": "06:00", "temperature": 26}, {"time": "08:00", "temperature": 16},
        {"time": "20:00", "temperature": 26}, {"time": "22:00", "temperature": 16}]
      selector:
        object:

get_schedule:
  target:
    entity:
      integration: sst_local
      domain: climate
